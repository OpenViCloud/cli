# Release of the openvicloud CLI: six bare binaries with the names the install script and the CLI guide use
# (openvicloud-<os>-<arch>[.exe]), SHA256SUMS of them, and a detached GPG signature of SHA256SUMS made with the
# OpenViCloud release key. Runs on a tag vX.Y.Z (.github/workflows/release.yml).
version: 2

project_name: openvicloud

builds:
  - id: openvicloud
    main: ./cmd/openvicloud
    binary: openvicloud
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [binary]
    name_template: "openvicloud-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

signs:
  - artifacts: checksum
    signature: "${artifact}.sig"
    args:
      - --batch
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

release:
  draft: false
  prerelease: auto

changelog:
  use: github
