name: CI

# Build, vet, unit tests, and the generated client matching the committed copy of the API contract
# (api/openapi-v1.json, synced from OpenViCloud/titan by scripts/sync-spec.sh).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Generated client matches the spec
        run: |
          go generate ./api/
          git diff --exit-code -- api/

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build every release target
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/openvicloud
          done
